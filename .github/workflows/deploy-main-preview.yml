name: Deploy Temporary Main Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  deploy-main-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build temporary preview
        env:
          VITE_PREVIEW_MODE: 'true'
          VITE_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add preview banner and SPA fallback
        run: |
          sed -i 's|<body>|<body><div id="preview-banner" style="background:#06c;color:#fff;padding:6px 16px;text-align:center;font-family:RedHatText,sans-serif;font-size:13px">Temporary UI Preview — backend API is not available</div>|' dist/index.html
          sed -i 's|<head>|<head><script>(function(){var p=new URLSearchParams(window.location.search).get("p");if(p){var base=window.location.pathname;if(base.endsWith("/")){base=base.slice(0,-1);}window.history.replaceState(null,"",base+p+window.location.hash);}})();</script>|' dist/index.html
          touch dist/.nojekyll
          cat > dist/404.html <<'SPAEOF'
          <!doctype html><html><head><meta charset="utf-8"><script>
          (function () {
            var path = window.location.pathname;
            var preview = path.match(/^(\/[^/]+\/pr-preview\/pr-\d+\/)/);
            var base = preview ? preview[1] : (path.match(/^(\/[^/]+\/)/) || [null, '/'])[1];
            var rest = path.slice(base.length);
            window.location.replace(base + '?p=/' + rest + window.location.hash);
          })();
          </script></head><body></body></html>
          SPAEOF

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
