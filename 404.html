<!doctype html><html><head><meta charset="utf-8"><script>
(function () {
  var path = window.location.pathname;
  var preview = path.match(/^(\/[^/]+\/pr-preview\/pr-\d+\/)/);
  var base = preview ? preview[1] : (path.match(/^(\/[^/]+\/)/) || [null, '/'])[1];
  var rest = path.slice(base.length);
  window.location.replace(base + '?p=/' + rest + window.location.hash);
})();
</script></head><body></body></html>
